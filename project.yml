name: iServe
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  iServe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.md"
      - path: ServerCore
        excludes:
          - "*.md"
      - path: FileSystem
        excludes:
          - "*.md"
      - path: Handlers
        excludes:
          - "*.md"
      - path: Transfer
        excludes:
          - "*.md"
      - path: Networking
        excludes:
          - "*.md"
      - path: Logging
        excludes:
          - "*.md"
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srgtcauliflour.iServe
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iServe
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: iServe needs local network access so other devices on your Wi-Fi can connect to the server you start.
        INFOPLIST_KEY_NSBonjourServices: _http._tcp.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  iServeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/iServeTests]
    dependencies:
      - target: iServe
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srgtcauliflour.iServeTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  iServe:
    build:
      targets:
        iServe: all
        iServeTests: [test]
    test:
      targets: [iServeTests]
      gatherCoverageData: true
