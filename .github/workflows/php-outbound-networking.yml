name: PHP outbound networking (v0.5, experimental)
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/php-outbound-networking.yml'

# Kept entirely separate from php-embed.yml on purpose, same reasoning
# ADR-0009 already established for keeping php-embed.yml separate from
# ios.yml: v0.5's own build engineering (mbedTLS, then curl against it,
# eventually wired into ext/curl) is new, unproven ground for this project
# -- a red X here must never block v0.4's already-stable PHP embed SAPI
# pipeline, and every job here runs with continue-on-error: true for the
# same reason those do. Deliberately incremental and CI-observed
# (docs/adr/0010-php-outbound-networking.md): mbedTLS is proven on its own
# first, before curl is ever built against it, before curl is ever wired
# into ext/curl, before that's wired into the real iServeWithPHP app
# target -- each step isolates exactly one new variable.

env:
  # mbedTLS 3.6.x LTS (supported with bug-fixes/security fixes until at
  # least March 2027 per the project's own release page), not the 4.x
  # line -- 4.x restructured around git submodules (tf-psa-crypto,
  # framework) that add real checkout/build complexity 3.6.x mostly
  # avoids. Chosen over OpenSSL/BoringSSL as curl's TLS backend since curl
  # removed Secure Transport (see ADR-0010's own correction) -- mbedTLS
  # targets embedded/constrained/mobile builds specifically, with a much
  # simpler cross-compile story (plain make, no perl/asm codegen steps to
  # fight in CI) and a smaller footprint than OpenSSL, which matters given
  # ADR-0009 already flagged app binary size as a real cost.
  #
  # 3.6.x DOES still need its own "framework" git submodule initialized --
  # confirmed by actually building it locally (`make lib` from a plain
  # clone fails on library/libmbedtls.a specifically, needing
  # framework/scripts/generate_ssl_debug_helpers.py; initializing the
  # submodule and rebuilding succeeds and produces a working library, both
  # verified for real, not assumed from documentation that turned out to
  # describe release tarballs rather than a git checkout). Every checkout
  # step below passes `submodules: recursive` for exactly this reason.
  MBEDTLS_REF: mbedtls-3.6.7
  # Current stable as of this writing (confirmed against curl's own
  # /releases/latest, not assumed) -- the same release ADR-0010's own TLS
  # backend correction was checked against.
  CURL_REF: curl-8_22_0
  # Same php-src tag php-embed.yml already builds (docs/adr/0009) -- v0.5's
  # ext/curl wiring extends that exact same libphp.a build, not a fork of it.
  PHP_SRC_REF: php-8.4.2

jobs:
  mbedtls-cross-compile-device:
    name: "Step 1: cross-compile mbedTLS (iOS device, arm64)"
    # Build-only, like php-embed.yml's own device cross-compile job: a
    # device binary targets real Apple Silicon inside an iPhone, not this
    # runner's own macOS kernel, so it can never execute here regardless
    # of how it's invoked. Proves the cross-compile itself succeeds and
    # produces real arm64 object code; mbedtls-native-smoke-test (below)
    # proves the same source actually works correctly, on a target that
    # can run it.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout mbedTLS
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: ${{ env.MBEDTLS_REF }}
          path: mbedtls
          submodules: recursive

      # mbedTLS's own classic Makefile (not the CMake build) respects
      # CC/AR/CFLAGS overrides directly and needs no buildconf/configure
      # step at all -- simpler than PHP's own autotools-based cross-compile
      # jobs. `lib` builds only library/lib{mbedcrypto,x509,mbedtls}.a,
      # skipping programs/ and tests/ (mbedTLS's own test suite needs a
      # host that can execute the result -- see the native job below, not
      # this one). SHARED is left unset, so only static .a archives are
      # produced, matching how this project links every other dependency.
      - name: Cross-compile mbedTLS static libraries (iOS device, arm64)
        working-directory: mbedtls
        run: |
          set -euo pipefail
          export IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          make CC="xcrun -sdk iphoneos clang -arch arm64" \
               AR="xcrun -sdk iphoneos ar" \
               CFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0 -O2" \
               lib

      - name: Check for the static libraries
        working-directory: mbedtls
        run: |
          set -euo pipefail
          for lib in libmbedcrypto.a libmbedx509.a libmbedtls.a; do
            path="library/$lib"
            test -f "$path" || (echo "$path not produced" && exit 1)
            file "$path"
          done

      # A curated package (static libs + public headers only, not the
      # whole checkout) for a later curl cross-compile job in this same
      # workflow to build against -- mirrors php-embed.yml's own PHPKit
      # packaging step exactly. Never committed to the repo (ADR-0009's
      # "reproducible from source, not a vendored binary blob" rule
      # applies here identically).
      - name: Package mbedTLS static libs + headers for the curl build
        if: success()
        working-directory: mbedtls
        run: |
          set -euo pipefail
          mkdir -p mbedtlskit/lib mbedtlskit/include
          cp library/libmbedcrypto.a library/libmbedx509.a library/libmbedtls.a mbedtlskit/lib/
          cp -R include/mbedtls mbedtlskit/include/
          if [ -d include/psa ]; then
            cp -R include/psa mbedtlskit/include/
          fi

      - name: Upload mbedTLS (iOS device)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mbedtls-ios-device-arm64
          path: mbedtls/mbedtlskit

  mbedtls-native-smoke-test:
    name: "Step 2: mbedTLS smoke test (native macOS host)"
    # Deliberately independent of mbedtls-cross-compile-device (own fresh
    # checkout, own build): a native build (build machine == target) can
    # actually execute here, isolating "does mbedTLS's own crypto code
    # produce correct output from this checkout/build flags" from every
    # iOS-SDK-cross-compile-specific risk -- the exact same split
    # php-embed.yml's cross-compile-device/native-smoke-test jobs already
    # use for PHP itself. Not running mbedTLS's own upstream test suite
    # (mature, already tested by its own maintainers on every commit) --
    # a small custom smoke test proving OUR build/link of it produces a
    # working binary is the thing actually unproven here, mirroring how
    # php-embed.yml's own smoke test is custom C, not php-src's own `make
    # test`.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout mbedTLS
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: ${{ env.MBEDTLS_REF }}
          path: mbedtls
          submodules: recursive

      - name: Build mbedTLS static libraries (native macOS)
        working-directory: mbedtls
        run: |
          set -euo pipefail
          make lib

      - name: Write + compile a SHA-256 smoke test
        working-directory: mbedtls
        run: |
          set -euo pipefail
          cat > smoke_test.c <<'EOF'
          #include <mbedtls/sha256.h>
          #include <stdio.h>
          #include <string.h>

          // Known-answer test: SHA-256("iserve mbedtls smoke test"), computed
          // independently via `shasum -a 256` rather than trusted from this
          // same build -- proves OUR build produces a *correct* digest, not
          // just *a* digest (a subtly broken cross-compile/codegen could
          // still link and run while producing wrong output).
          static const char expected_hex[] =
              "00376f7391fc2fbd6d0504d316425d80a44e3a95ff43786c1b7f39637fb58b69";

          int main(void)
          {
              const unsigned char input[] = "iserve mbedtls smoke test";
              unsigned char digest[32];
              int rc = mbedtls_sha256(input, strlen((const char *)input), digest, 0);
              if (rc != 0) {
                  fprintf(stderr, "FAIL: mbedtls_sha256 returned %d\n", rc);
                  return 1;
              }

              char hex[65];
              for (int i = 0; i < 32; i++) {
                  snprintf(hex + i * 2, 3, "%02x", digest[i]);
              }
              printf("digest=%s\n", hex);

              if (strcmp(hex, expected_hex) != 0) {
                  fprintf(stderr, "FAIL: digest mismatch, expected %s\n", expected_hex);
                  return 1;
              }
              printf("PASS: digest matches known answer\n");
              return 0;
          }
          EOF
          clang smoke_test.c -o smoke_test -Iinclude library/libmbedcrypto.a
          ./smoke_test | tee smoke_output.txt
          grep -q "^PASS: digest matches known answer$" smoke_output.txt || (echo "mbedTLS smoke test failed" && exit 1)

  curl-cross-compile-device:
    name: "Step 3: cross-compile curl (iOS device, arm64) against mbedTLS"
    # Depends on mbedtls-cross-compile-device's own artifact (the same
    # device-target mbedTLS build, not a fresh one) -- curl has to link
    # against the exact same target/arch mbedTLS was just proven to
    # produce, the same "one new variable at a time" reasoning as every
    # other job in this workflow.
    needs: mbedtls-cross-compile-device
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout curl
        uses: actions/checkout@v4
        with:
          repository: curl/curl
          ref: ${{ env.CURL_REF }}
          path: curl

      # Unlike php-src, curl's git checkout has no buildconf script to
      # generate ./configure -- confirmed by actually attempting a local
      # build (`./buildconf` doesn't exist in this checkout; GIT-INFO.md
      # names `autoreconf -fi` as curl's own documented replacement).
      # autoconf/automake alone (already used for PHP) aren't enough:
      # curl's configure.ac calls LT_INIT, so libtool/libtoolize has to be
      # present too, which php-embed.yml's own brew install line never
      # needed.
      - name: Install autoconf/automake/libtool/pkg-config
        run: brew install autoconf automake libtool pkg-config

      - name: Download mbedTLS (iOS device)
        uses: actions/download-artifact@v4
        with:
          name: mbedtls-ios-device-arm64
          path: mbedtlskit

      - name: autoreconf (generate ./configure)
        working-directory: curl
        run: autoreconf -fi

      # --with-mbedtls=PATH expects PATH/include + PATH/lib -- exactly the
      # layout mbedtls-cross-compile-device's own packaging step already
      # produces, confirmed directly against curl's configure.ac rather
      # than assumed. --without-openssl is explicit (not just omitted)
      # since a bare --without-ssl conflicts with --with-mbedtls and fails
      # configure outright -- caught by actually running this configure
      # line locally (Linux, native, against a locally-built mbedTLS)
      # before ever trusting it in a cross-compile job here.
      #
      # Protocol surface restricted to http/https only, per ADR-0010:
      # curl uses one --disable-<protocol> flag per protocol (confirmed
      # against configure.ac), not a single allowlist option. ipfs/ipns
      # and websockets are enabled by curl's own defaults independent of
      # the protocol list above (--disable-ipfs / --disable-websockets
      # are their own separate flags) and are disabled here for the same
      # "http/https only" reason -- also only found by actually reading
      # this exact configure run's own summary output locally, not
      # assumed from the flag name list alone.
      #
      # --without-libpsl: curl's Public Suffix List support (used for
      # stricter cookie-domain matching) hard-fails configure if libpsl
      # isn't present rather than silently disabling -- not worth adding
      # a fourth from-source dependency for a cookie-jar refinement this
      # project doesn't use (PHP scripts here don't get a curl cookie
      # jar API surface exposed at all, per ADR-0010's resource-bounds
      # section disabling curl_multi_* and the option-clamping patch).
      #
      # HTTP/2 (nghttp2) intentionally NOT wired in yet, despite ADR-0010's
      # own text mentioning it as part of curl's general capability class
      # -- it's a fourth from-source dependency, and this workflow's own
      # discipline is one new variable per step. --without-nghttp2 is
      # explicit, not just an omission: a first real CI run on macOS-14
      # failed curl-native-smoke-test's own link step with undefined
      # nghttp2 symbols, because the runner has nghttp2 available via
      # pkg-config (likely a Homebrew dependency of something else
      # preinstalled on the image) and curl's configure auto-detects and
      # links it unless explicitly told not to -- omitting the flag is not
      # the same as HTTP/2 actually being absent. Revisit once curl itself
      # (HTTP/1.1, mbedTLS) is proven end-to-end.
      #
      # --without-libidn2 for the exact same reason: the runner also has
      # libidn2 available via pkg-config, which curl auto-links for
      # internationalized-domain-name support unless told not to. Not
      # needed for this project's scope yet, and left implicit it would
      # also risk curl-cross-compile-device silently picking up a
      # native-macOS-architecture libidn2 via an unscoped pkg-config
      # search when cross-compiling -- a link (or worse, a silently wrong-
      # architecture) failure waiting to happen whenever this is wired
      # into a real linked binary, not just a static .a. Revisit alongside
      # HTTP/2 once there's an actual need for non-ASCII hostnames.
      - name: configure (cross-compile for iOS device, arm64, against mbedTLS)
        working-directory: curl
        run: |
          export IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export CC="xcrun -sdk iphoneos clang -arch arm64"
          export CFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export LDFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          ./configure \
            --host=aarch64-apple-darwin \
            --prefix="$GITHUB_WORKSPACE/curlkit" \
            --with-mbedtls="$GITHUB_WORKSPACE/mbedtlskit" \
            --without-openssl \
            --without-libpsl \
            --without-nghttp2 \
            --without-libidn2 \
            --disable-shared --enable-static \
            --disable-ftp --disable-file --disable-ldap --disable-ldaps \
            --disable-rtsp --disable-dict --disable-telnet --disable-tftp \
            --disable-pop3 --disable-imap --disable-smtp --disable-gopher \
            --disable-mqtt --disable-ipfs --disable-websockets

      # Only the library, not the curl CLI tool or docs -- embedding needs
      # libcurl.a alone, and building just lib/ (confirmed locally to work
      # as a standalone make target right after configure, no top-level
      # make needed first) skips real dependencies the CLI tool pulls in
      # that the library itself doesn't need.
      - name: make (libcurl only)
        working-directory: curl
        run: make -C lib -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200

      - name: Check for libcurl.a
        working-directory: curl
        run: |
          test -f lib/.libs/libcurl.a || (echo "libcurl.a not produced" && exit 1)
          file lib/.libs/libcurl.a

      # A curated package (libcurl.a + its own public headers + a working
      # pkg-config file + the mbedTLS static libs it links against, so a
      # later ext/curl build has everything pkg-config needs in one
      # place) -- mirrors mbedtls-cross-compile-device's own packaging
      # step and php-embed.yml's PHPKit pattern.
      #
      # No `make install` needed for this: `libcurl.pc` is generated by
      # ./configure itself (an AC_CONFIG_FILES substitution, confirmed
      # directly against configure.ac), already sitting at the curl
      # checkout's own root with the real `--prefix` path baked in --
      # `make install`'s only remaining job is copying files to where
      # that prefix says they belong, which this step does by hand
      # instead, skipping the cost of a cross-compiled curl CLI tool/docs
      # build that `make install`'s normal dependency chain would pull in.
      # Headers are copied by extension, not the whole `include/curl/`
      # directory, so its own build-system files (Makefile.am, etc.)
      # don't end up alongside the real headers.
      - name: Package curl static lib + headers + pkg-config file for the ext/curl build
        if: success()
        run: |
          mkdir -p curlkit/lib/pkgconfig curlkit/include/curl
          cp curl/lib/.libs/libcurl.a curlkit/lib/
          cp curl/libcurl.pc curlkit/lib/pkgconfig/
          cp curl/include/curl/*.h curlkit/include/curl/
          cp mbedtlskit/lib/*.a curlkit/lib/

      - name: Upload curl (iOS device)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: curl-ios-device-arm64
          path: curlkit

  curl-native-smoke-test:
    name: "Step 4: curl + mbedTLS smoke test (native macOS host, real HTTPS request)"
    # Deliberately independent of both curl-cross-compile-device and
    # mbedtls-native-smoke-test (own fresh checkouts, own builds) -- the
    # same isolation reasoning as every other *-native-smoke-test job in
    # this project. A native build lets curl's own configure-time checks
    # actually execute (the normal non-cross-compiling autoconf path),
    # and -- unlike mbedtls-native-smoke-test's own crypto-only known-
    # answer test -- this is the step that proves the whole stack works
    # together: curl, actually linked against mbedTLS, actually performing
    # a real TLS 1.2/1.3 handshake and HTTP request against a real server,
    # not just linking cleanly.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout mbedTLS
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: ${{ env.MBEDTLS_REF }}
          path: mbedtls
          submodules: recursive

      - name: Checkout curl
        uses: actions/checkout@v4
        with:
          repository: curl/curl
          ref: ${{ env.CURL_REF }}
          path: curl

      - name: Install autoconf/automake/libtool/pkg-config
        run: brew install autoconf automake libtool pkg-config

      - name: Build mbedTLS static libraries (native macOS)
        working-directory: mbedtls
        run: make lib -j"$(sysctl -n hw.ncpu)"

      - name: Package mbedTLS static libs + headers for curl's --with-mbedtls
        working-directory: mbedtls
        run: |
          mkdir -p mbedtlskit/lib mbedtlskit/include
          cp library/libmbedcrypto.a library/libmbedx509.a library/libmbedtls.a mbedtlskit/lib/
          cp -R include/mbedtls mbedtlskit/include/
          if [ -d include/psa ]; then
            cp -R include/psa mbedtlskit/include/
          fi

      - name: autoreconf (generate ./configure)
        working-directory: curl
        run: autoreconf -fi

      - name: configure (native macOS build, against mbedTLS)
        working-directory: curl
        run: |
          ./configure \
            --with-mbedtls="$GITHUB_WORKSPACE/mbedtls/mbedtlskit" \
            --without-openssl \
            --without-libpsl \
            --without-nghttp2 \
            --without-libidn2 \
            --disable-shared --enable-static \
            --disable-ftp --disable-file --disable-ldap --disable-ldaps \
            --disable-rtsp --disable-dict --disable-telnet --disable-tftp \
            --disable-pop3 --disable-imap --disable-smtp --disable-gopher \
            --disable-mqtt --disable-ipfs --disable-websockets

      - name: make (libcurl only)
        working-directory: curl
        run: make -C lib -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200

      - name: Check for libcurl.a
        working-directory: curl
        run: |
          test -f lib/.libs/libcurl.a || (echo "libcurl.a not produced" && exit 1)

      # Real end-to-end proof, not just "it links": curl_version_info()
      # confirms the running binary actually reports mbedTLS as its TLS
      # backend (not a stray system libcurl picked up by accident), then
      # a real curl_easy_perform() against a real HTTPS server proves the
      # TLS handshake + HTTP request genuinely work, not just that object
      # files linked cleanly -- the same "prove OUR build produces
      # correct behavior" standard mbedtls-native-smoke-test's own known-
      # answer test already applies to raw crypto output.
      #
      # -framework CoreFoundation -framework SystemConfiguration: a real
      # CI run caught these as missing -- checked directly against curl's
      # own lib/curl_setup.h rather than guessed: Curl_macos_init()
      # (lib/macos.c, called unconditionally from curl_global_init() on
      # any native build) reads the OS's configured proxy settings via
      # SCDynamicStoreCopyProxies, gated on CURL_MACOS_CALL_COPYPROXIES --
      # which that header only defines for TARGET_OS_MAC builds that are
      # NOT also TARGET_OS_IPHONE. That confirms this code (and these two
      # frameworks) is specific to this native-macOS verification job and
      # curl-cross-compile-device's real iOS build never compiles it in
      # at all, so nothing here widens the actual app's own link surface.
      - name: Write + compile + run a curl+mbedTLS HTTPS smoke test
        working-directory: curl
        run: |
          cat > curl_smoke_test.c <<'EOF'
          #include <curl/curl.h>
          #include <stdio.h>
          #include <string.h>

          static size_t discard(char *ptr, size_t size, size_t nmemb, void *userdata) {
              (void)ptr; (void)userdata;
              return size * nmemb;
          }

          int main(void) {
              curl_version_info_data *vi = curl_version_info(CURLVERSION_NOW);
              printf("ssl_version=%s\n", vi->ssl_version ? vi->ssl_version : "(none)");
              if (!vi->ssl_version || strstr(vi->ssl_version, "mbedTLS") == NULL) {
                  fprintf(stderr, "FAIL: curl was not built against mbedTLS (ssl_version=%s)\n",
                          vi->ssl_version ? vi->ssl_version : "(none)");
                  return 1;
              }

              CURL *h = curl_easy_init();
              if (!h) { fprintf(stderr, "FAIL: curl_easy_init returned NULL\n"); return 1; }

              curl_easy_setopt(h, CURLOPT_URL, "https://pypi.org/");
              curl_easy_setopt(h, CURLOPT_WRITEFUNCTION, discard);
              curl_easy_setopt(h, CURLOPT_TIMEOUT, 15L);
              curl_easy_setopt(h, CURLOPT_FOLLOWLOCATION, 1L);

              CURLcode rc = curl_easy_perform(h);
              if (rc != CURLE_OK) {
                  fprintf(stderr, "FAIL: curl_easy_perform: %s\n", curl_easy_strerror(rc));
                  curl_easy_cleanup(h);
                  return 1;
              }

              long code = 0;
              curl_easy_getinfo(h, CURLINFO_RESPONSE_CODE, &code);
              printf("http_status=%ld\n", code);
              curl_easy_cleanup(h);

              if (code != 200) {
                  fprintf(stderr, "FAIL: unexpected HTTP status %ld\n", code);
                  return 1;
              }
              printf("PASS: real HTTPS request over mbedTLS succeeded\n");
              return 0;
          }
          EOF
          clang curl_smoke_test.c -o curl_smoke_test \
            -Iinclude \
            lib/.libs/libcurl.a \
            ../mbedtls/mbedtlskit/lib/libmbedtls.a \
            ../mbedtls/mbedtlskit/lib/libmbedx509.a \
            ../mbedtls/mbedtlskit/lib/libmbedcrypto.a \
            -lz -framework CoreFoundation -framework SystemConfiguration
          ./curl_smoke_test | tee curl_smoke_output.txt
          grep -q "^PASS: real HTTPS request over mbedTLS succeeded$" curl_smoke_output.txt || (echo "curl+mbedTLS smoke test failed" && exit 1)

  php-curl-native-smoke-test:
    name: "Step 5: wire ext/curl into libphp.a (native macOS host, real curl_exec() via embed SAPI)"
    # Independent of every job above (own fresh mbedTLS/curl/php-src
    # checkouts and builds) -- same isolation reasoning as every other
    # *-native-smoke-test job in this project. This is the step ADR-0010
    # and docs/ROADMAP.md's v0.5 section actually ask for first: "ext/curl
    # compiled into libphp.a against that mbedTLS." Proving it natively,
    # before ever cross-compiling it for a device PHP can't run a test
    # program on, isolates "does php-src's ext/curl correctly detect and
    # link our from-source curl+mbedTLS" from every iOS-SDK-specific risk
    # -- the same split php-embed.yml's own cross-compile-device/
    # native-smoke-test jobs already use for the embed SAPI itself.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout mbedTLS
        uses: actions/checkout@v4
        with:
          repository: Mbed-TLS/mbedtls
          ref: ${{ env.MBEDTLS_REF }}
          path: mbedtls
          submodules: recursive

      - name: Checkout curl
        uses: actions/checkout@v4
        with:
          repository: curl/curl
          ref: ${{ env.CURL_REF }}
          path: curl

      - name: Checkout php-src
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: ${{ env.PHP_SRC_REF }}
          path: php-src

      # Union of curl's own build prerequisites (autoconf/automake/
      # libtool/pkg-config) and php-embed.yml's own (autoconf/bison/re2c)
      # -- this job builds both from source in one run, so it needs
      # everything either one does.
      - name: Install build prerequisites
        run: |
          brew install autoconf automake libtool pkg-config bison re2c
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Build mbedTLS static libraries (native macOS)
        working-directory: mbedtls
        run: make lib -j"$(sysctl -n hw.ncpu)"

      - name: Package mbedTLS static libs + headers for curl's --with-mbedtls
        working-directory: mbedtls
        run: |
          mkdir -p mbedtlskit/lib mbedtlskit/include
          cp library/libmbedcrypto.a library/libmbedx509.a library/libmbedtls.a mbedtlskit/lib/
          cp -R include/mbedtls mbedtlskit/include/
          if [ -d include/psa ]; then
            cp -R include/psa mbedtlskit/include/
          fi

      - name: autoreconf (generate ./configure)
        working-directory: curl
        run: autoreconf -fi

      # --prefix matters here even on a native build that never runs
      # `make install`: it's baked directly into libcurl.pc at configure
      # time (confirmed by reading that file's own content locally, no
      # install step needed to see it), and this job's own pkg-config
      # lookup below depends on that path actually matching where the
      # library + pkgconfig file get placed.
      - name: configure curl (native macOS build, against mbedTLS)
        working-directory: curl
        run: |
          ./configure \
            --prefix="$GITHUB_WORKSPACE/curlkit" \
            --with-mbedtls="$GITHUB_WORKSPACE/mbedtls/mbedtlskit" \
            --without-openssl \
            --without-libpsl \
            --without-nghttp2 \
            --without-libidn2 \
            --disable-shared --enable-static \
            --disable-ftp --disable-file --disable-ldap --disable-ldaps \
            --disable-rtsp --disable-dict --disable-telnet --disable-tftp \
            --disable-pop3 --disable-imap --disable-smtp --disable-gopher \
            --disable-mqtt --disable-ipfs --disable-websockets

      - name: make curl (libcurl only)
        working-directory: curl
        run: make -C lib -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200

      # Same packaging shape as curl-cross-compile-device's own step (see
      # its comment for why no `make install` is needed) -- a pkg-config
      # file php-src's own ext/curl/config.m4 requires (confirmed directly
      # against its source: it calls PKG_CHECK_MODULES([CURL], [libcurl
      # >= 7.61.0]), not a plain --with-curl=PATH directory convention).
      - name: Package curl static lib + headers + pkg-config file
        run: |
          mkdir -p curlkit/lib/pkgconfig curlkit/include/curl
          cp curl/lib/.libs/libcurl.a curlkit/lib/
          cp curl/libcurl.pc curlkit/lib/pkgconfig/
          cp curl/include/curl/*.h curlkit/include/curl/
          cp mbedtls/mbedtlskit/lib/*.a curlkit/lib/

      - name: buildconf php-src (generate ./configure)
        working-directory: php-src
        run: ./buildconf --force

      # Same extension set php-embed.yml's own native-smoke-test already
      # builds (ADR-0009's allowlist), plus --with-curl. PKG_CONFIG_PATH
      # scoped to exactly this job's own curlkit -- nothing else on the
      # runner should have a libcurl.pc, but being explicit costs nothing
      # and avoids ever silently picking up a stray system one.
      #
      # A first real CI run on macOS-14 failed exactly here: PKG_CHECK_MODULES
      # itself succeeded (version/SSL metadata read fine from libcurl.pc),
      # but ext/curl/config.m4's own follow-up link probe --
      # PHP_CHECK_LIBRARY([curl], [curl_easy_perform], ..., [$CURL_LIBS])
      # (confirmed directly against that file's real content, not
      # assumed) -- failed with "checking for curl_easy_perform in
      # -lcurl... no". That macro (build/php.m4) folds its 5th argument
      # into LDFLAGS via PHP_EVAL_LIBLINE, while AC_CHECK_LIB's own
      # "-lcurl" addition lands in LIBS -- LDFLAGS entries sit BEFORE the
      # compiled test program on the link line, LIBS entries AFTER, so a
      # strict single-pass linker (ld64) can process libcurl.a's
      # dependencies before anything has yet asked for them, then never
      # revisit them once the test program's own "-lcurl" (now needing
      # curl_easy_perform) is linked in later. Exporting LIBS/LDFLAGS
      # ourselves, matching pkg-config's own reported flags, puts
      # "-lcurl" and its dependencies in the position a single-pass
      # linker actually needs: LDFLAGS only for the -L search path (safe
      # to set globally, adds a search path, forces nothing to link),
      # LIBS for the "-lcurl plus what it depends on" chain so it's
      # already in the autoconf-default position (after the test
      # program) before this macro's own AC_CHECK_LIB prepends "-lcurl"
      # to it again.
      - name: configure php-src (native macOS build, embed SAPI + ext/curl)
        working-directory: php-src
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/curlkit/lib/pkgconfig"
          export LDFLAGS="-L$GITHUB_WORKSPACE/curlkit/lib"
          export LIBS="-lmbedtls -lmbedx509 -lmbedcrypto -lbrotlidec -lz"
          ./configure \
            --disable-all \
            --without-pear \
            --disable-cli \
            --disable-cgi \
            --disable-phpdbg \
            --enable-embed=static \
            --enable-session=static \
            --enable-pdo=static \
            --with-pdo-sqlite=static \
            --with-sqlite3=static \
            --enable-filter=static \
            --enable-mbstring=static \
            --disable-mbregex \
            --with-curl

      # On failure, config.log (not echoed to stdout by configure itself)
      # has the real compiler/linker invocation and error -- printed here
      # so a future failure is diagnosable straight from the CI log,
      # without a separate log-fetch round trip.
      - name: Dump config.log on configure failure
        if: failure()
        working-directory: php-src
        run: tail -100 config.log

      - name: Check ext/curl was actually detected (not silently skipped)
        working-directory: php-src
        run: grep -q "^#define HAVE_CURL 1$" main/php_config.h || (echo "ext/curl was not enabled -- check the configure log above" && exit 1)

      - name: make php-src
        working-directory: php-src
        run: make -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200

      - name: Check for libphp.a and the curl_init symbol
        working-directory: php-src
        run: |
          test -f libs/libphp.a || (echo "libphp.a not produced" && exit 1)
          nm libs/libphp.a 2>/dev/null | grep -q "zif_curl_init" || (echo "zif_curl_init not found in libphp.a -- ext/curl did not actually link in" && exit 1)

      # Real end-to-end proof, not just "it links": a PHP script, run
      # through the actual embed SAPI, calling curl_init()/curl_setopt()/
      # curl_exec()/curl_getinfo()/curl_error()/curl_close() against a
      # real HTTPS server -- the same standard curl-native-smoke-test
      # already holds curl itself to, one level up the stack.
      - name: Write + compile + run a PHP ext/curl embed-SAPI smoke test
        working-directory: php-src
        run: |
          cat > embed_curl_test.c <<'EOF'
          #include <sapi/embed/php_embed.h>

          int main(int argc, char **argv) {
              PHP_EMBED_START_BLOCK(argc, argv)
              zend_eval_string(
                  "$ch = curl_init('https://pypi.org/');"
                  "curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);"
                  "curl_setopt($ch, CURLOPT_TIMEOUT, 15);"
                  "$body = curl_exec($ch);"
                  "$code = curl_getinfo($ch, CURLINFO_HTTP_CODE);"
                  "$err = curl_error($ch);"
                  "curl_close($ch);"
                  "echo ($code === 200 && strlen((string)$body) > 0 && $err === '')"
                  "    ? 'PASS: curl_exec via embed SAPI succeeded'"
                  "    : 'FAIL: code=' . $code . ' len=' . strlen((string)$body) . ' err=' . $err;"
                  "echo PHP_EOL;",
                  NULL, "embed_curl_test"
              );
              PHP_EMBED_END_BLOCK()
              return 0;
          }
          EOF
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/curlkit/lib/pkgconfig"
          clang embed_curl_test.c -o embed_curl_test \
            -I. -Imain -IZend -ITSRM -Iinclude \
            -DZEND_ENABLE_STATIC_TSRMLS_CACHE=1 \
            libs/libphp.a \
            $(pkg-config --libs libcurl) \
            -lresolv -liconv -lm -lsqlite3
          ./embed_curl_test | tee embed_curl_output.txt
          grep -q "^PASS: curl_exec via embed SAPI succeeded$" embed_curl_output.txt || (echo "PHP ext/curl embed SAPI smoke test failed" && exit 1)

  php-curl-cross-compile-device:
    name: "Step 6: cross-compile libphp.a + ext/curl (iOS device, arm64, build-only)"
    # Combines what php-curl-native-smoke-test and curl-cross-compile-device
    # each proved separately: ext/curl correctly detects and links our
    # from-source curl+mbedTLS (proven natively, where a test program can
    # actually run), and curl itself cross-compiles for a real device
    # (proven in curl-cross-compile-device). Neither proved both at once.
    # Build-only, like both of those device-targeting jobs: a device
    # binary can't execute on this runner regardless of how it's invoked.
    needs: curl-cross-compile-device
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout php-src
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: ${{ env.PHP_SRC_REF }}
          path: php-src

      - name: Install autoconf/bison/re2c/pkg-config
        run: |
          brew install autoconf bison re2c pkg-config
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Download curl (iOS device)
        uses: actions/download-artifact@v4
        with:
          name: curl-ios-device-arm64
          path: curlkit

      # Same posix_spawn probe patch php-embed.yml's own cross-compile-device
      # job applies, for the same reason -- unrelated to ext/curl, just a
      # precondition of buildconf regenerating ./configure successfully
      # for this iOS target at all.
      - name: Patch config.m4 — skip posix_spawn_file_actions_addchdir_np probe (unavailable on iOS)
        working-directory: php-src
        run: |
          sed -i '' 's/AC_CHECK_FUNCS(\[posix_spawn_file_actions_addchdir_np elf_aux_info\])/AC_CHECK_FUNCS([elf_aux_info])/' ext/standard/config.m4

      - name: buildconf (generate ./configure)
        working-directory: php-src
        run: ./buildconf --force

      # Same cross-compile flags as php-embed.yml's own cross-compile-device
      # job, plus --with-curl and PKG_CONFIG_PATH pointed at the downloaded
      # curlkit. pkg-config itself always runs on the build host regardless
      # of what target ./configure is cross-compiling for -- it only parses
      # the .pc file's text, so this needs no cross-compile-specific
      # handling beyond pointing it at the right (device-target) kit.
      - name: configure (cross-compile for iOS device, arm64, embed SAPI + ext/curl)
        working-directory: php-src
        run: |
          export IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export CC="xcrun -sdk iphoneos clang -arch arm64"
          export CXX="xcrun -sdk iphoneos clang++ -arch arm64"
          export CFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export CXXFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export LDFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export SQLITE_CFLAGS="-I$IOS_SDK/usr/include"
          export SQLITE_LIBS="-L$IOS_SDK/usr/lib -lsqlite3"
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/curlkit/lib/pkgconfig"
          ./configure \
            --host=aarch64-apple-darwin \
            --disable-all \
            --without-pear \
            --disable-cli \
            --disable-cgi \
            --disable-phpdbg \
            --enable-embed=static \
            --without-pcre-jit \
            --enable-session=static \
            --enable-pdo=static \
            --with-pdo-sqlite=static \
            --with-sqlite3=static \
            --enable-filter=static \
            --enable-mbstring=static \
            --disable-mbregex \
            --with-curl

      - name: Check ext/curl was actually detected (not silently skipped)
        working-directory: php-src
        run: grep -q "^#define HAVE_CURL 1$" main/php_config.h || (echo "ext/curl was not enabled -- check the configure log above" && exit 1)

      - name: make (embed SAPI only)
        working-directory: php-src
        run: make -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200

      - name: Check for libphp.a and the curl_init symbol
        working-directory: php-src
        run: |
          find . -name "libphp.a" -exec ls -la {} \;
          test -f libs/libphp.a || (echo "libphp.a not produced" && exit 1)
          nm libs/libphp.a 2>/dev/null | grep -q "zif_curl_init" || (echo "zif_curl_init not found in libphp.a -- ext/curl did not actually link in" && exit 1)

      # Deliberately a separate artifact name from php-embed.yml's own
      # "phpkit-iphoneos" -- this is still experimental v0.5 work this
      # file alone owns; nothing in php-embed.yml or the real iServeWithPHP
      # app build depends on or is affected by this artifact existing.
      - name: Package libphp.a + headers for a later iServeWithPHP wiring step
        if: success()
        working-directory: php-src
        run: |
          mkdir -p phpkit/lib phpkit/include
          cp libs/libphp.a phpkit/lib/libphp.a
          for dir in Zend main TSRM sapi include; do
            if [ -d "$dir" ]; then
              find "$dir" -name '*.h' | while read -r f; do
                mkdir -p "phpkit/include/$(dirname "$f")"
                cp "$f" "phpkit/include/$f"
              done
            fi
          done

      - name: Upload PHPKit-with-curl (iOS device)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phpkit-with-curl-iphoneos
          path: php-src/phpkit
